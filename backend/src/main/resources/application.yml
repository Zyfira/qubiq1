server:
  port: ${PORT:8080}
spring:
  application:
    name: qubiq-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qubiq}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-to-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
